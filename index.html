<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wasteland RPG</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="pipboy-frame">
    <header id="pipboy-header">
      <div class="header-left">
        <span class="brand">WASTELAND RPG</span>
        <span class="header-sub">PIP-UNIT 3000</span>
      </div>
      <div class="header-center" id="header-location"></div>
      <div class="header-right">
        <button id="sound-toggle" class="icon-btn" data-action="toggleSound" title="Toggle sound">♪ ON</button>
        <span id="header-time">00:00</span>
      </div>
    </header>

    <div id="frenzy-banner" class="hidden"></div>

    <div id="pipboy-main">
      <nav id="pipboy-sidebar">
        <button class="tab-button" data-tab="status" data-action="tab" data-arg="status"><span class="key">1</span>STAT</button>
        <button class="tab-button" data-tab="map" data-action="tab" data-arg="map"><span class="key">2</span>MAP</button>
        <button class="tab-button" data-tab="inventory" data-action="tab" data-arg="inventory"><span class="key">3</span>INV</button>
        <button class="tab-button" data-tab="combat" data-action="tab" data-arg="combat"><span class="key">4</span>COMBAT</button>
        <button class="tab-button" data-tab="camp" data-action="tab" data-arg="camp"><span class="key">5</span>C.A.M.P.</button>
        <button class="tab-button" data-tab="allies" data-action="tab" data-arg="allies"><span class="key">6</span>ALLIES</button>
        <button class="tab-button" data-tab="log" data-action="tab" data-arg="log"><span class="key">7</span>LOG</button>
      </nav>

      <main id="pipboy-content">
        <section class="tab-content" id="tab-status"></section>
        <section class="tab-content hidden" id="tab-map"></section>
        <section class="tab-content hidden" id="tab-inventory"></section>
        <section class="tab-content hidden" id="tab-combat"></section>
        <section class="tab-content hidden" id="tab-camp"></section>
        <section class="tab-content hidden" id="tab-allies"></section>
        <section class="tab-content hidden" id="tab-log"></section>
      </main>
    </div>

    <footer id="pipboy-footer">
      <div class="hud-block" id="hud-hp">
        <span class="hud-label">HP</span>
        <div class="bar bar-hp hud-bar">
          <div class="fill" id="hud-hp-fill"></div>
          <div class="rad-fill" id="hud-rad-fill"></div>
        </div>
        <span class="hud-value" id="hud-hp-text"></span>
      </div>
      <div class="hud-block">
        <span class="hud-label">AP</span>
        <div class="bar bar-ap hud-bar"><div class="fill" id="hud-ap-fill"></div></div>
        <span class="hud-value" id="hud-ap-text"></span>
      </div>
      <div class="hud-block">
        <span class="hud-label">LVL <span id="hud-level"></span></span>
        <div class="bar bar-xp hud-bar"><div class="fill" id="hud-xp-fill"></div></div>
      </div>
      <div class="hud-block hud-rads hidden" id="hud-rads-wrap">
        <span class="hud-label">☢</span><span class="hud-value" id="hud-rads"></span>
      </div>
      <div class="hud-block hud-caps">
        <img src="caps_icon.png" alt="Caps" class="caps-icon">
        <span class="hud-value" id="hud-caps"></span>
      </div>
    </footer>

    <div id="scanlines"></div>
    <div class="crt-vignette"></div>
    <div id="toasts"></div>
    <div id="modal" class="hidden"></div>

    <div id="boot">
      <div id="boot-press">
        <div class="power-icon">⏻</div>
        <p>&gt; PRESS ANY KEY OR CLICK TO POWER ON<span class="cursor">_</span></p>
      </div>
      <pre id="boot-text" class="hidden"></pre>
      <div id="start-menu" class="hidden"></div>
    </div>
  </div>

  <input type="file" id="import-input" accept=".json,application/json" class="hidden">

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
